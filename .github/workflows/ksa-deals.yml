name: KSA deals channel post
on:
  schedule:
    - cron: '7 7-20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ksa-deals
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post next due deal
        run: node ksa-deals.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KSA_DEALS_BOT_TOKEN: ${{ secrets.KSA_DEALS_BOT_TOKEN }}
      - name: Save queue state
        run: |
          if git diff --quiet data/ksa-deals-queue.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ksa-deals-queue.json
          git commit -m "KSA deals queue state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
