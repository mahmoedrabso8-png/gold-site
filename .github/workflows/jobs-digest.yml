name: Jobs digest post
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      delete_message_id:
        description: 'Optional: delete this message id from the channel instead of posting'
        required: false
permissions:
  contents: read
concurrency:
  group: jobs-digest
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post digest to @emaratijob
        run: node jobs-digest.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DELETE_MESSAGE_ID: ${{ github.event.inputs.delete_message_id }}
