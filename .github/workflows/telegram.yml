name: Telegram post
on:
  schedule:
    # 3 مرات يومياً: 8 صباحاً و2 ظهراً و8 مساءً بتوقيت دبي (بدل 5 مرات × 6 منشورات)
    - cron: '3 4,10,16 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post to Telegram
        run: node telegram.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
