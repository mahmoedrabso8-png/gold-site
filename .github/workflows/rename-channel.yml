name: Telegram channel profile and post (one-off)
on:
  push:
    paths:
      - '.github/rename-channel.flag'
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update description, logo and post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          show() { python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('ok'),d.get('description'),d.get('result',{}).get('message_id') if isinstance(d.get('result'),dict) else '')"; }
          echo "description:"; curl -s "$api/setChatDescription" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "description@.github/tg-desc.txt" | show
          echo "photo:"; curl -s "$api/setChatPhoto" --form-string "chat_id=${TELEGRAM_CHAT_ID}" -F "photo=@icon-512x512.png" | show || true
          echo "post:"; curl -s "$api/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text@.github/tg-post.txt" | show || true
          echo "after:"; curl -s "$api/getChat?chat_id=${TELEGRAM_CHAT_ID}" | python3 -c "import json,sys;r=json.load(sys.stdin).get('result',{});print(r.get('title'),'|',r.get('description'),'| photo:',bool(r.get('photo')))"
